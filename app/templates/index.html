{% extends "base.html" %}

{% block header %}Caller ID Reputation{% endblock %}

{% block content %}
<div class="space-y-10" id="mainContent" style="display: none">
    <!-- Stats Overview -->
    <div class="grid grid-cols-4 gap-6">
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <div class="text-gray-500 text-sm">Healthy Numbers</div>
            <div class="mt-2 flex items-baseline">
                <div class="text-2xl font-bold text-gray-800" id="healthyPercentage">--%</div>
            </div>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <div class="text-gray-500 text-sm">Spam Reports</div>
            <div class="mt-2 flex items-baseline">
                <div class="text-2xl font-bold text-gray-800" id="totalReports">--</div>
            </div>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <div class="text-gray-500 text-sm">Active Numbers</div>
            <div class="mt-2 flex items-baseline">
                <div class="text-2xl font-bold text-gray-800" id="activeNumbers">--</div>
            </div>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <div class="text-gray-500 text-sm">Total Numbers</div>
            <div class="mt-2 flex items-baseline">
                <div class="text-2xl font-bold text-gray-800" id="totalNumbers">--</div>
            </div>
        </div>
    </div>

    <!-- Phone Numbers Section -->
    <div class="bg-white rounded-2xl shadow-sm">
        <div class="px-6 pt-6 pb-4 border-b border-gray-100">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold text-gray-800">Phone Numbers</h2>
                <button onclick="showAddNumberModal()" class="bg-mint-100 text-mint-500 px-4 py-2 rounded-full text-sm font-medium hover:bg-mint-200 transition-colors">
                    Add Number
                </button>
            </div>
        </div>
        
        <div class="divide-y divide-gray-100" id="phoneNumbersList">
            <!-- Phone numbers will be populated here -->
        </div>
    </div>
</div>

<!-- Add Number Modal -->
<div id="addNumberModal" class="hidden fixed inset-0 bg-gray-500 bg-opacity-50 flex items-center justify-center">
    <div class="bg-white rounded-2xl p-6 w-[480px] shadow-xl">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-lg font-semibold text-gray-800">Add New Phone Number</h3>
            <button onclick="hideAddNumberModal()" class="text-gray-400 hover:text-gray-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                <input type="text" id="newPhoneNumber" placeholder="+1 (555) 123-4567" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-mint-100 focus:border-mint-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Monitoring Frequency (minutes)</label>
                <input type="number" id="monitoringFrequency" placeholder="5" min="1" max="1440"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-mint-100 focus:border-mint-500 outline-none">
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button onclick="hideAddNumberModal()" 
                    class="px-4 py-2 text-gray-600 hover:text-gray-800 font-medium">
                    Cancel
                </button>
                <button onclick="addNewNumber()" 
                    class="px-4 py-2 bg-mint-100 text-mint-500 rounded-lg font-medium hover:bg-mint-200 transition-colors">
                    Add Number
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    async function fetchPhoneNumbers() {
        try {
            const response = await fetch('/api/v1/phone-numbers/');
            const numbers = await response.json();
            
            let totalActive = 0;
            let totalReports = 0;
            let healthyNumbers = 0;
            
            const listHtml = numbers.map(number => {
                if (!number.disabled) totalActive++;
                totalReports += number.spam_reports || 0;
                if (!number.is_spam && number.spam_reports === 0) healthyNumbers++;
                
                const statusColor = number.reputation > 90 ? 'green' : number.reputation > 80 ? 'yellow' : 'red';
                
                return `
                    <div class="flex items-center justify-between p-4 px-6">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 flex items-center justify-center rounded-full ${number.is_spam ? 'bg-red-100' : 'bg-mint-100'}">
                                ${number.entity_type === 'BUSINESS' ? 
                                    '<svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>' : 
                                    '<svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>'
                                }
                            </div>
                            <input type="text" value="${number.number}" 
                                class="font-medium bg-transparent hover:bg-gray-50 px-2 py-1 rounded focus:ring-2 focus:ring-mint-100 focus:outline-none"
                                onchange="updateNumber(${number.id}, this.value)">
                            <div class="flex items-center text-gray-500 space-x-2 ml-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                                <input type="number" value="${number.monitoring_frequency}" min="1" max="1440"
                                    class="w-12 bg-transparent hover:bg-gray-50 px-1 py-0.5 rounded focus:ring-2 focus:ring-mint-100 focus:outline-none text-right"
                                    onchange="updateFrequency(${number.id}, this.value)">
                                <span class="text-sm">min</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-8">
                            <div class="flex items-center space-x-2">
                                <span class="font-medium truncate">${number.business_name || 'UNKNOWN'}</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <svg class="w-4 h-4 ${number.spam_reports > 0 ? 'text-red-500' : 'text-gray-400'}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                                </svg>
                                <span class="text-sm ${number.spam_reports > 0 ? 'text-red-500' : 'text-gray-500'}">${number.spam_reports || 0}</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" class="sr-only peer" ${!number.disabled ? 'checked' : ''} onchange="toggleNumber(${number.id}, this.checked)">
                                    <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-mint-100 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-mint-500"></div>
                                </label>
                            </div>
                            <button onclick="deleteNumber(${number.id})" class="text-gray-400 hover:text-gray-600">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('phoneNumbersList').innerHTML = listHtml;
            document.getElementById('healthyPercentage').textContent = `${Math.round((healthyNumbers / numbers.length) * 100)}%`;
            document.getElementById('totalReports').textContent = totalReports;
            document.getElementById('activeNumbers').textContent = totalActive;
            document.getElementById('totalNumbers').textContent = numbers.length;
            
        } catch (error) {
            console.error('Failed to fetch phone numbers:', error);
        }
    }

    function showAddNumberModal() {
        document.getElementById('addNumberModal').classList.remove('hidden');
    }

    function hideAddNumberModal() {
        document.getElementById('addNumberModal').classList.add('hidden');
    }

    async function addNewNumber() {
        const number = document.getElementById('newPhoneNumber').value;
        const frequency = parseInt(document.getElementById('monitoringFrequency').value) || 5;
        
        if (!number) {
            alert('Please enter a phone number');
            return;
        }

        try {
            const response = await fetch('/api/v1/phone-numbers/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    number: number,
                    monitoring_frequency: frequency
                })
            });

            if (response.ok) {
                hideAddNumberModal();
                fetchPhoneNumbers();
            } else {
                const data = await response.json();
                alert(data.detail || 'Failed to add number');
            }
        } catch (error) {
            console.error('Failed to add number:', error);
            alert('Failed to add number');
        }
    }

    async function updateNumber(id, number) {
        try {
            const response = await fetch(`/api/v1/phone-numbers/${id}`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ number })
            });

            if (response.ok) {
                fetchPhoneNumbers();
            } else {
                const data = await response.json();
                alert(data.detail || 'Failed to update number');
                fetchPhoneNumbers();
            }
        } catch (error) {
            console.error('Failed to update number:', error);
            alert('Failed to update number');
            fetchPhoneNumbers();
        }
    }

    async function updateFrequency(id, frequency) {
        frequency = parseInt(frequency);
        if (isNaN(frequency) || frequency < 1 || frequency > 1440) {
            alert('Frequency must be between 1 and 1440 minutes');
            fetchPhoneNumbers();
            return;
        }

        try {
            const response = await fetch(`/api/v1/phone-numbers/${id}`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ monitoring_frequency: frequency })
            });

            if (!response.ok) {
                const data = await response.json();
                alert(data.detail || 'Failed to update frequency');
                fetchPhoneNumbers();
            }
        } catch (error) {
            console.error('Failed to update frequency:', error);
            alert('Failed to update frequency');
            fetchPhoneNumbers();
        }
    }

    async function toggleNumber(id, enabled) {
        try {
            const response = await fetch(`/api/v1/phone-numbers/${id}`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ disabled: !enabled })
            });

            if (!response.ok) {
                const data = await response.json();
                alert(data.detail || 'Failed to toggle number');
                fetchPhoneNumbers();
            }
        } catch (error) {
            console.error('Failed to toggle number:', error);
            alert('Failed to toggle number');
            fetchPhoneNumbers();
        }
    }

    async function deleteNumber(id) {
        if (!confirm('Are you sure you want to delete this number?')) {
            return;
        }

        try {
            const response = await fetch(`/api/v1/phone-numbers/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                fetchPhoneNumbers();
            } else {
                const data = await response.json();
                alert(data.detail || 'Failed to delete number');
            }
        } catch (error) {
            console.error('Failed to delete number:', error);
            alert('Failed to delete number');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        checkAuthentication().then(isAuthenticated => {
            if (isAuthenticated) {
                fetchPhoneNumbers();
            }
        });
    });
</script>
{% endblock %}
